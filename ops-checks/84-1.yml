# #84 이번 달 급변동 리포트 멈춤, 시도 1. 지표와 통과값은 이슈의 "시도 1 · 판정 기준" 댓글을 옮긴 것이다.
# LLM 비용은 브리핑 작업 기록(job_log)의 사용량을 Sonnet 단가 비(입력 1, 캐시 쓰기 1.25, 캐시 읽기 0.05, 출력 5)로 더한 값이다.
# 보내기 전 검사가 끝내 실패한 기록은 사용량이 시도 목록(failedAttempts) 안에 있어 세지 않는다. 기준선(11-17·11-18) 측정과 같은 방식이다.
# 확인기는 마감 후 판 시작 알림 때 돌아 그 판의 호출은 아직 없지만, 통과 조건이 급변동 비용 0이라 판정에는 영향이 없다.
issue: 84
attempt: 1
fix_commit: "4a98ffa"
days: 2
metrics:
  - key: move_llm_cost_share
    # 오늘(한국 날짜) 시작한 작업의 LLM 비용 중 급변동 작업의 비율. 급변동이 없던 날은 비워 판정 보류.
    sql: >-
      WITH day AS (SELECT (now() AT TIME ZONE 'Asia/Seoul')::date::timestamp AT TIME ZONE 'Asia/Seoul' AS start),
      runs AS (SELECT job_id, job_kind FROM briefing.job_run, day WHERE started_at >= day.start),
      usage AS (SELECT runs.job_kind, coalesce(job_log.data -> 'usage', job_log.data -> 'llm' -> 'usage') AS u
        FROM briefing.job_log JOIN runs ON runs.job_id = job_log.job_id),
      cost AS (SELECT job_kind, coalesce((u ->> 'cacheWrite')::numeric, 0) * 1.25 + coalesce((u ->> 'cacheRead')::numeric, 0) * 0.05
        + coalesce((u ->> 'input')::numeric, 0) + coalesce((u ->> 'output')::numeric, 0) * 5 AS c
        FROM usage WHERE json_typeof(u) = 'object')
      SELECT CASE WHEN NOT EXISTS (SELECT 1 FROM runs WHERE job_kind = 'move') THEN NULL
        WHEN coalesce(sum(c), 0) = 0 THEN 0
        ELSE coalesce(sum(c) FILTER (WHERE job_kind = 'move'), 0) / sum(c) END
      FROM cost
    pass: "== 0"
human:
  - 그날 급변동 메일이 한 통도 오지 않았는지 메일함으로 확인
  - 마감 후 판 '그날 급변동'에 그날 변동이 결과 문구 없는 줄로 나왔는지 확인
  - 마감 후 판 서버 상태에 그날 급변동이 '리포트 멈춤'으로 세어졌는지 확인
