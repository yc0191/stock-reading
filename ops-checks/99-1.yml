# #99 급변동 레벨 중·상 나누기, 시도 1. 지표와 통과값은 이슈의 "시도 1 · 판정 기준" 댓글을 옮긴 것이다.
# 급변동 작업은 브리핑 작업 기록(job_kind = 'move')이고, 레벨은 입력인 market.move 원문의 감지 유형으로 정한다(prevCloseHigh만 상).
# LLM 호출은 단계별 실행 기록(job_step)의 llm 단계로 센다. 실패한 호출도 한 줄 남으므로 부른 적이 있으면 빠지지 않는다.
# 중 급변동이 없던 날은 두 지표 모두 비워 판정 보류한다.
issue: 99
attempt: 1
fix_commit: "bf5e5a5"
days: 2
metrics:
  - key: mid_move_llm_or_mail_ratio
    # 오늘(한국 날짜) 중 급변동 작업 중 LLM을 부르거나 결과 이벤트(메일)를 낸 작업의 비율. 중은 둘 다 없어야 한다.
    sql: >-
      WITH day AS (SELECT (now() AT TIME ZONE 'Asia/Seoul')::date::timestamp AT TIME ZONE 'Asia/Seoul' AS start),
      mids AS (SELECT job_id, result_event_id FROM briefing.job_run, day
        WHERE job_kind = 'move' AND started_at >= day.start
          AND coalesce(input -> 'payload' ->> 'detectionType', '') <> 'prevCloseHigh')
      SELECT CASE WHEN NOT EXISTS (SELECT 1 FROM mids) THEN NULL
        ELSE (SELECT count(*) FROM mids WHERE result_event_id IS NOT NULL
          OR EXISTS (SELECT 1 FROM briefing.job_step s WHERE s.job_id = mids.job_id AND s.step = 'llm'))::numeric
          / (SELECT count(*) FROM mids) END
    pass: "== 0"
  - key: mid_move_representative_ratio
    # 오늘 끝난 중 급변동 작업 중 대표 기사 기록(representative-article, 관련 기사 없음도 한 줄)이 있는 비율. 모두 있어야 한다.
    # 작업 중인 것은 뺀다(마감 직후 변동은 확인기가 돌 때 아직 기사를 기다릴 수 있다). 실패로 끝난 작업은 대표 기사 없이 끝난 중이라 분모에 둔다.
    sql: >-
      WITH day AS (SELECT (now() AT TIME ZONE 'Asia/Seoul')::date::timestamp AT TIME ZONE 'Asia/Seoul' AS start),
      mids AS (SELECT job_id FROM briefing.job_run, day
        WHERE job_kind = 'move' AND started_at >= day.start AND status <> 'running'
          AND coalesce(input -> 'payload' ->> 'detectionType', '') <> 'prevCloseHigh')
      SELECT CASE WHEN NOT EXISTS (SELECT 1 FROM mids) THEN NULL
        ELSE (SELECT count(*) FROM mids WHERE EXISTS (SELECT 1 FROM briefing.job_log l
          WHERE l.job_id = mids.job_id AND l.entry_type = 'representative-article'))::numeric
          / (SELECT count(*) FROM mids) END
    pass: "== 1"
