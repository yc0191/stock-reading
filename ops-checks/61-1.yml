# #61 아침 판을 밤사이 움직임과 ETF 이유 중심으로, 시도 1. 지표와 통과값은 이슈의 "시도 1 · 판정 기준" 댓글을 옮긴 것이다.
# 확인기는 마감 후 판 시작 알림 때 돌므로 그날 아침 판은 이미 끝나 있다.
# 그래프를 넣지 못한 판은 멤버 판 기록(member-briefing)의 missingItems에 '흐름 그래프:'로 시작하는 줄이 남는다(daily_jobs.py).
# 자료가 짧아 그리지 않은 그래프는 줄이 남지 않으므로 빠짐으로 세지 않는다.
issue: 61
attempt: 1
fix_commit: "3588c58"
days: 2
metrics:
  - key: morning_failed
    # 오늘(한국 날짜) 아침 판 작업이 실패했거나 LLM 없이 규칙 글로 나갔으면 1, 아니면 0. 아침 판 작업이 없으면 비워 판정 보류.
    # 근거가 없어 규칙 글이 된 판과 확인기가 돌 때까지 끝나지 않은 판도 1이다(둘 다 받는 사람에게는 문제인 판이다).
    sql: >-
      WITH day AS (SELECT (now() AT TIME ZONE 'Asia/Seoul')::date::timestamp AT TIME ZONE 'Asia/Seoul' AS start),
      job AS (SELECT status, generated_by FROM briefing.job_run, day
        WHERE job_kind = 'morning' AND started_at >= day.start ORDER BY started_at DESC LIMIT 1)
      SELECT CASE WHEN NOT EXISTS (SELECT 1 FROM job) THEN NULL
        WHEN (SELECT status = 'failed' OR generated_by IS DISTINCT FROM 'llm' FROM job) THEN 1 ELSE 0 END
    pass: "== 0"
  - key: morning_chart_missing_ratio
    # 오늘 아침 판의 멤버 판 중 흐름 그래프를 넣지 못한 판의 비율. 멤버 판이 없으면 비워 판정 보류.
    sql: >-
      WITH day AS (SELECT (now() AT TIME ZONE 'Asia/Seoul')::date::timestamp AT TIME ZONE 'Asia/Seoul' AS start),
      job AS (SELECT job_id FROM briefing.job_run, day
        WHERE job_kind = 'morning' AND started_at >= day.start ORDER BY started_at DESC LIMIT 1),
      members AS (SELECT l.data -> 'missingItems' AS items FROM briefing.job_log l JOIN job ON l.job_id = job.job_id
        WHERE l.entry_type = 'member-briefing')
      SELECT CASE WHEN NOT EXISTS (SELECT 1 FROM members) THEN NULL
        ELSE (SELECT count(*) FROM members WHERE CASE WHEN json_typeof(items) = 'array' THEN EXISTS (
          SELECT 1 FROM json_array_elements_text(items) AS item WHERE item LIKE '흐름 그래프:%') ELSE false END)::numeric
          / (SELECT count(*) FROM members) END
    pass: "== 0"
