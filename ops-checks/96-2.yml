# #96 시세 튄 값 막기, 시도 2. 지표와 통과값은 이슈의 "시도 2 · 판정 기준" 댓글을 옮긴 것이다.
# 시도 1의 튄 가격 지표는 앞뒤 60초를 합친 중앙값과 비교해, 장 시작 직후 실제로 빠르게 반등한 급변동(11-23 09:00)을 튄 값으로 셌다.
# 시도 2는 급변동 가격이 앞 60초 중앙값과도, 뒤 60초 중앙값과도 2% 넘게 다를 때만 튄 값으로 센다(한 번만 튄 값은 양쪽과 다르고,
# 실제 변동은 적어도 한쪽과 가깝다). 한쪽 구간에 시세가 없으면 세지 않는다. 칸 검사 지표는 시도 1과 같다.
# 칸 검사로 버린 응답은 시세 조회 실패 기록(quote_failure)에 FIELD_MISMATCH 로 남는다. 분모는 저장한 시세와 실패 기록을 합친 조회 수다.
# 급변동 가격은 브리핑 작업 기록의 급변동 작업(job_kind = 'move') 입력인 market.move 이벤트 원문에서 읽는다.
issue: 96
attempt: 2
fix_commit: "583434d"
days: 2
metrics:
  - key: field_mismatch_ratio
    # 오늘(한국 날짜) 칸 검사로 버린 응답 / (실패 기록 + 저장한 시세). 바뀐 규칙이 더 버리는 응답은 저장 시세의 약 0.0006%로 쟀으므로
    # 기준선(11-17~19 장중 약 0.13~0.18%)과 거의 같아야 한다. 통과선은 기준선의 약 2배다. 둘 다 0이면 비워 판정 보류.
    sql: >-
      WITH day AS (SELECT (now() AT TIME ZONE 'Asia/Seoul')::date::timestamp AT TIME ZONE 'Asia/Seoul' AS start),
      failed AS (SELECT count(*) AS n, count(*) FILTER (WHERE failure_type = 'FIELD_MISMATCH') AS mismatch
        FROM market.quote_failure, day WHERE occurred_at >= day.start),
      stored AS (SELECT count(*) AS n FROM market.price_snapshot, day WHERE as_of >= day.start)
      SELECT CASE WHEN failed.n + stored.n = 0 THEN NULL ELSE failed.mismatch::numeric / (failed.n + stored.n) END
      FROM failed, stored
    pass: "< 0.003"
  - key: outlier_move_ratio
    # 발행 가격이 같은 종목의 앞 60초 시세 중앙값과도, 뒤 60초 시세 중앙값과도 2% 넘게 다른 급변동 / 오늘 급변동 수. 급변동이 없으면 0.
    # 비교 시각은 브리핑이 급변동을 받은 시각(started_at)이다. 앞 구간에 급변동을 만든 시세가 섞여도 중앙값이라 결과가 바뀌지 않는다.
    sql: >-
      WITH day AS (SELECT (now() AT TIME ZONE 'Asia/Seoul')::date::timestamp AT TIME ZONE 'Asia/Seoul' AS start),
      moves AS (SELECT job_id, input -> 'payload' ->> 'symbol' AS symbol, (input -> 'payload' ->> 'price')::numeric AS price,
        started_at AS at
        FROM briefing.job_run, day WHERE job_kind = 'move' AND started_at >= day.start),
      near AS (SELECT moves.job_id, moves.price,
        (SELECT percentile_cont(0.5) WITHIN GROUP (ORDER BY s.price) FROM market.price_snapshot s, day
          WHERE s.symbol = moves.symbol AND s.as_of >= day.start - INTERVAL '1 minute'
            AND s.as_of >= moves.at - INTERVAL '60 seconds' AND s.as_of < moves.at) AS before_median,
        (SELECT percentile_cont(0.5) WITHIN GROUP (ORDER BY s.price) FROM market.price_snapshot s, day
          WHERE s.symbol = moves.symbol AND s.as_of >= day.start - INTERVAL '1 minute'
            AND s.as_of > moves.at AND s.as_of <= moves.at + INTERVAL '60 seconds') AS after_median
        FROM moves)
      SELECT CASE WHEN (SELECT count(*) FROM moves) = 0 THEN 0
        ELSE (SELECT count(*) FROM near WHERE before_median > 0 AND after_median > 0
          AND abs(price - before_median) * 100 / before_median > 2
          AND abs(price - after_median) * 100 / after_median > 2)::numeric / (SELECT count(*) FROM moves) END
    pass: "== 0"
