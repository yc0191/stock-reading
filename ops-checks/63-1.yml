# #63 레벨 상 급변동 메일을 짧게, 장중 차트와 함께, 시도 1. 지표와 통과값은 이슈의 "시도 1 · 판정 기준" 댓글을 옮긴 것이다.
# 상 급변동 작업은 브리핑 작업 기록(job_kind = 'move') 중 입력 market.move 원문의 감지 유형이 prevCloseHigh인 것이다.
# 차트를 넣지 못한 메일은 발행 때 작업 기록(missing-items)의 missingItems에 '장중 차트:'로 시작하는 줄이 남는다(move_mail.py).
# 상 급변동이 없던 날은 두 지표 모두 비워 판정 보류한다. 상은 드물어 측정일이 차기까지 여러 장날이 걸릴 수 있다.
issue: 63
attempt: 1
fix_commit: "11a3df9"
days: 2
metrics:
  - key: high_move_failed_ratio
    # 오늘(한국 날짜) 끝난 상 급변동 작업 중 실패로 끝났거나 LLM 없이 규칙 글로 쓴 작업의 비율.
    sql: >-
      WITH day AS (SELECT (now() AT TIME ZONE 'Asia/Seoul')::date::timestamp AT TIME ZONE 'Asia/Seoul' AS start),
      highs AS (SELECT status, generated_by FROM briefing.job_run, day
        WHERE job_kind = 'move' AND started_at >= day.start AND status <> 'running'
          AND input -> 'payload' ->> 'detectionType' = 'prevCloseHigh')
      SELECT CASE WHEN NOT EXISTS (SELECT 1 FROM highs) THEN NULL
        ELSE (SELECT count(*) FROM highs WHERE status = 'failed' OR generated_by = 'rule-based')::numeric
          / (SELECT count(*) FROM highs) END
    pass: "== 0"
  - key: high_mail_chart_missing_ratio
    # 오늘 메일을 낸(결과 이벤트가 있는) 상 급변동 작업 중 장중 차트를 넣지 못한 작업의 비율.
    # 메일 내용(view)이 없는 리포트는 차트 줄을 남기지 않아 빠짐으로 세지 못한다. 지금 상 리포트는 LLM 글·규칙 글 모두 view가 있다(report.py).
    sql: >-
      WITH day AS (SELECT (now() AT TIME ZONE 'Asia/Seoul')::date::timestamp AT TIME ZONE 'Asia/Seoul' AS start),
      sent AS (SELECT job_id FROM briefing.job_run, day
        WHERE job_kind = 'move' AND started_at >= day.start AND result_event_id IS NOT NULL
          AND input -> 'payload' ->> 'detectionType' = 'prevCloseHigh')
      SELECT CASE WHEN NOT EXISTS (SELECT 1 FROM sent) THEN NULL
        ELSE (SELECT count(*) FROM sent WHERE EXISTS (SELECT 1 FROM briefing.job_log l
          CROSS JOIN LATERAL json_array_elements_text(l.data -> 'missingItems') AS item
          WHERE l.job_id = sent.job_id AND l.entry_type = 'missing-items'
            AND json_typeof(l.data -> 'missingItems') = 'array' AND item LIKE '장중 차트:%'))::numeric
          / (SELECT count(*) FROM sent) END
    pass: "== 0"
human:
  - 상 메일의 원인이 3개 이내이고 칸마다 한 문장으로 짧은지
  - 근거 목록이 메일 맨 아래에 한 번만 있고 '확인하지 못한 것'이 메일에 없는지
  - 장중 차트(09:00부터 변동 5분 뒤까지, 전일 종가 점선, 앞선 급변동 표시)가 메일 안에 보이는지
  - 그날 앞선 급변동이 있었다면 '오늘 흐름' 목록이 나왔는지
