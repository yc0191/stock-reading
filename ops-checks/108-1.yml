# #108 장 시작 급변동을 아침 판에 모으는 것을 국내 ETF로만 좁힘, 시도 1. 지표와 통과값은 이슈의 "시도 1 · 판정 기준" 댓글을 옮긴 것이다.
# 확인기는 마감 후 판 시작 알림 때 돌므로 그날 09:00~09:10 합침 구간은 이미 끝나 있다. 그래서 오늘을 잰다.
# 급변동 작업 기록(job_run)의 input은 작업을 시작시킨 market.move 이벤트 원문이라, 시세처리기가 변동을 낸 시각(producedAt)과
# 작업 시작 시각(started_at)의 차이가 브리핑이 변동을 붙잡아 둔 시간이다. 조치 전에는 개별 주식 변동도 아침 판이 끝날 때까지(약 18분) 붙잡혔다.
# 국내 ETF가 아닌 종목은 market.etf(market='KR')에 없는 종목이다.
# 오늘 운영 버전이 조치 전 버전(04c0c6e)이면(배포 실패) 비워 판정 보류한다.
