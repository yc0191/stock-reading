  - key: open_stock_move_held_ratio
    # 오늘 09:00~09:10에 나온 국내 ETF가 아닌 종목의 급변동 작업 중, 변동이 나온 뒤 2분 넘게 지나 작업이 시작된 작업의 비율.
    # 통과는 0(모두 2분 안에 시작, 붙잡히지 않음). 0보다 크면 실패(하나라도 붙잡힘). 그런 작업이 없는 날은 비워 판정 보류한다.
    sql: >-
      WITH win AS (SELECT (now() AT TIME ZONE 'Asia/Seoul')::date + TIME '09:00' AS start_local
        WHERE current_setting('ops_checker.deploy_version', true) NOT LIKE '04c0c6e%'),
      moves AS (SELECT r.started_at, (r.input ->> 'producedAt')::timestamptz AS produced_at
        FROM briefing.job_run r, win
        WHERE r.job_kind = 'move'
          AND (r.input ->> 'producedAt')::timestamptz >= win.start_local AT TIME ZONE 'Asia/Seoul'
          AND (r.input ->> 'producedAt')::timestamptz < (win.start_local + INTERVAL '10 minutes') AT TIME ZONE 'Asia/Seoul'
          AND NOT EXISTS (SELECT 1 FROM market.etf e WHERE e.market = 'KR' AND e.symbol = r.input -> 'payload' ->> 'symbol'))
      SELECT CASE WHEN NOT EXISTS (SELECT 1 FROM moves) THEN NULL
        ELSE (SELECT count(*) FROM moves WHERE started_at > produced_at + INTERVAL '2 minutes')::numeric
          / (SELECT count(*) FROM moves) END
