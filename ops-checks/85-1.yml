# #85 급변동 감지 기준 상향·기준선 언저리 반복 발행 막기, 시도 1. 지표와 통과값은 이슈의 "시도 1 · 판정 기준" 댓글을 옮긴 것이다.
# 급변동 수는 브리핑 작업 기록의 급변동 작업(job_kind = 'move', 리포트를 멈춘 것 포함, #84)으로 센다. 입력은 market.move 이벤트 원문이다.
# 급변동이 하나도 없던 날은 댓글 기준대로 통과다(지표 1이 0이 되어 그 사실이 남는다).
issue: 85
attempt: 1
fix_commit: "4a98ffa"
days: 2
metrics:
  - key: move_count_vs_baseline
    # 오늘(한국 날짜) 급변동 수 / 기준선(11-17·11-18) 하루 평균. 기준선 건수는 공개하지 않으므로 그 두 날 기록에서 계산한다. 1을 넘으면 1로 자른다.
    sql: >-
      WITH day AS (SELECT (now() AT TIME ZONE 'Asia/Seoul')::date::timestamp AT TIME ZONE 'Asia/Seoul' AS start),
      base AS (SELECT count(*) / 2.0 AS n FROM briefing.job_run WHERE job_kind = 'move'
        AND started_at >= TIMESTAMP '2026-11-17 00:00' AT TIME ZONE 'Asia/Seoul'
        AND started_at < TIMESTAMP '2026-11-19 00:00' AT TIME ZONE 'Asia/Seoul'),
      today AS (SELECT count(*) AS n FROM briefing.job_run, day WHERE job_kind = 'move' AND started_at >= day.start)
      SELECT CASE WHEN base.n = 0 THEN NULL ELSE LEAST(today.n / base.n, 1) END FROM base, today
    pass: "<= 0.30"
  - key: same_symbol_repeat_ratio
    # (오늘 급변동 수 - 급변동이 난 종목 수) / 오늘 급변동 수. 기준선은 두 날 중 낮은 쪽(11-18 약 72%)이다. 급변동이 없으면 0.
    sql: >-
      WITH day AS (SELECT (now() AT TIME ZONE 'Asia/Seoul')::date::timestamp AT TIME ZONE 'Asia/Seoul' AS start),
      moves AS (SELECT input -> 'payload' ->> 'symbol' AS symbol FROM briefing.job_run, day
        WHERE job_kind = 'move' AND started_at >= day.start)
      SELECT CASE WHEN count(*) = 0 THEN 0 ELSE (count(*) - count(DISTINCT symbol))::numeric / count(*) END FROM moves
    pass: "< 0.72"
  - key: below_new_threshold_ratio
    # 새 기준(최근 5분 3% 이상, 전일 종가 대비 5% 이상)에 못 미친 급변동 / 오늘 급변동 수. 유형이 없는 이전 형식은 최근 5분 기준으로 본다.
    sql: >-
      WITH day AS (SELECT (now() AT TIME ZONE 'Asia/Seoul')::date::timestamp AT TIME ZONE 'Asia/Seoul' AS start),
      moves AS (SELECT input -> 'payload' ->> 'detectionType' AS kind, abs((input -> 'payload' ->> 'changePercent')::numeric) AS pct
        FROM briefing.job_run, day WHERE job_kind = 'move' AND started_at >= day.start)
      SELECT CASE WHEN count(*) = 0 THEN 0
        ELSE count(*) FILTER (WHERE pct < CASE WHEN kind = 'prevClose' THEN 5 ELSE 3 END)::numeric / count(*) END FROM moves
    pass: "== 0"
  - key: small_republish_ratio
    # 같은 종목·유형의 직전 발행 가격에서 그 유형의 기준(최근 5분 3%, 전일 종가 대비 5%)만큼 움직이지 않은 채 다시 발행된 급변동 / 오늘 급변동 수.
    # 댓글의 "3% 미만 재발행"을 포함하고, 시세처리기가 같은 유형 재발행에 요구하는 유형별 기준까지 본다. 변동률은 시세처리기처럼 소수 둘째 자리에서 반올림한다.
    # 같은 유형 안에서만 비교하므로, 다시 발행 간격(120분) 안에서 다른 유형으로 3% 미만 움직인 채 나간 발행은 보지 않는다.
    # 시세처리기는 간격 때문에 막은 변동의 가격도 유형 상태에 남겨 그 가격과 비교하므로, 막은 가격에서는 충분히 움직였지만 직전 발행 가격에서는 덜 움직인 정상 발행을 드물게 셀 수 있다. 실패하면 시세처리기 로그로 확인한다.
    sql: >-
      WITH day AS (SELECT (now() AT TIME ZONE 'Asia/Seoul')::date::timestamp AT TIME ZONE 'Asia/Seoul' AS start),
      moves AS (SELECT coalesce(input -> 'payload' ->> 'detectionType', 'window') AS kind,
        (input -> 'payload' ->> 'price')::numeric AS price,
        lag((input -> 'payload' ->> 'price')::numeric) OVER (
          PARTITION BY input -> 'payload' ->> 'symbol', coalesce(input -> 'payload' ->> 'detectionType', 'window')
          ORDER BY started_at, job_id) AS last_price
        FROM briefing.job_run, day WHERE job_kind = 'move' AND started_at >= day.start)
      SELECT CASE WHEN count(*) = 0 THEN 0
        ELSE count(*) FILTER (WHERE last_price > 0
          AND round(abs(price - last_price) * 100 / last_price, 2) < CASE WHEN kind = 'prevClose' THEN 5 ELSE 3 END)::numeric / count(*) END
      FROM moves
    pass: "== 0"
