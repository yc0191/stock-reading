# 로컬 개발용 인프라. 포트는 모두 localhost에만 바인딩한다.
# 저장소 루트에서 실행: docker compose -f infra/compose/docker-compose.yml --env-file .env up -d
services:
  kafka:
    image: apache/kafka:4.2.2
    container_name: stock-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      # 이미지 기본값과 같지만, 다른 컨테이너(kafka-ui)가 붙을 수 있도록 INTERNAL(kafka:19092)을 추가했다.
      # 호스트의 앱은 계속 localhost:9092를 쓴다.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # 토픽은 서비스가 명시적으로 선언한다. 자동 생성을 켜 두면 소비자가 먼저 떠서
      # 파티션 1개짜리 토픽을 만들어 버려, 나머지 파티션이 조용히 읽히지 않는다.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  postgres:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    container_name: stock-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      MARKET_DB_USER: ${MARKET_DB_USER}
      MARKET_DB_PASSWORD: ${MARKET_DB_PASSWORD}
      NEWS_DB_USER: ${NEWS_DB_USER}
      NEWS_DB_PASSWORD: ${NEWS_DB_PASSWORD}
      BRIEFING_DB_USER: ${BRIEFING_DB_USER}
      BRIEFING_DB_PASSWORD: ${BRIEFING_DB_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # 브리핑 테이블을 Flyway로 만든다(services/briefing/db/migration). 브리핑은 테이블을 만들지 않으므로 브리핑보다 먼저 끝나 있어야 한다.
  # `docker compose up -d`가 Postgres가 준비된 뒤 한 번 실행하고 끝난다. 새 파일을 더한 뒤에는
  # `docker compose -f infra/compose/docker-compose.yml --env-file .env run --rm briefing-migrate`로 다시 적용한다.
  # Java 서비스(market, news)는 기동할 때 Spring이 같은 방식으로 적용한다.
  briefing-migrate:
    image: flyway/flyway:12.4.0
    container_name: stock-briefing-migrate
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      FLYWAY_USER: ${BRIEFING_DB_USER}
      FLYWAY_PASSWORD: ${BRIEFING_DB_PASSWORD}
      FLYWAY_SCHEMAS: briefing
      FLYWAY_DEFAULT_SCHEMA: briefing
      FLYWAY_CREATE_SCHEMAS: "false"
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    volumes:
      - ../../services/briefing/db/migration:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  # market 표를 Flyway로 먼저 만든다(services/market/src/main/resources/db/migration). personal 스키마가 market.etf·market.stock을
  # 가리키므로 personal보다 먼저 끝나 있어야 한다. Java 서비스(market)가 기동할 때 적용하는 것과 같은 파일이라 이어서 기동해도 충돌하지 않는다.
  market-migrate:
    image: flyway/flyway:12.4.0
    container_name: stock-market-migrate
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      FLYWAY_USER: ${MARKET_DB_USER}
      FLYWAY_PASSWORD: ${MARKET_DB_PASSWORD}
      FLYWAY_SCHEMAS: market
      FLYWAY_DEFAULT_SCHEMA: market
      FLYWAY_CREATE_SCHEMAS: "false"
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    volumes:
      - ../../services/market/src/main/resources/db/migration:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  # personal 스키마의 계정과 권한을 만든다(infra/db/personal/init.sql). 여러 번 돌려도 같다. market 표가 만들어진 뒤에 돈다.
  personal-init:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    container_name: stock-personal-init
    entrypoint: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/init/init.sql"]
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_ADMIN_USER}
      PGPASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      MARKET_DB_USER: ${MARKET_DB_USER}
      PERSONAL_OWNER_DB_USER: ${PERSONAL_OWNER_DB_USER}
      PERSONAL_OWNER_DB_PASSWORD: ${PERSONAL_OWNER_DB_PASSWORD}
      PERSONAL_WRITER_DB_USER: ${PERSONAL_WRITER_DB_USER}
      PERSONAL_WRITER_DB_PASSWORD: ${PERSONAL_WRITER_DB_PASSWORD}
      COLLECTOR_DB_USER: ${COLLECTOR_DB_USER}
      COLLECTOR_DB_PASSWORD: ${COLLECTOR_DB_PASSWORD}
      NOTIFIER_DB_USER: ${NOTIFIER_DB_USER}
      NOTIFIER_DB_PASSWORD: ${NOTIFIER_DB_PASSWORD}
    volumes:
      - ../db/personal/init.sql:/init/init.sql:ro
    depends_on:
      market-migrate:
        condition: service_completed_successfully

  # personal 표(멤버·메일·포트폴리오)를 Flyway로 만든다(infra/db/personal/migration). market 표와 계정이 만들어진 뒤에 돈다.
  # 새 파일을 더한 뒤에는 `docker compose -f infra/compose/docker-compose.yml --env-file .env run --rm personal-migrate`로 다시 적용한다.
  personal-migrate:
    image: flyway/flyway:12.4.0
    container_name: stock-personal-migrate
    command: ["migrate", "-placeholders.market_user=${MARKET_DB_USER}", "-placeholders.collector_user=${COLLECTOR_DB_USER}", "-placeholders.notifier_user=${NOTIFIER_DB_USER}", "-placeholders.writer_user=${PERSONAL_WRITER_DB_USER}"]
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      FLYWAY_USER: ${PERSONAL_OWNER_DB_USER}
      FLYWAY_PASSWORD: ${PERSONAL_OWNER_DB_PASSWORD}
      FLYWAY_SCHEMAS: personal
      FLYWAY_DEFAULT_SCHEMA: personal
      FLYWAY_CREATE_SCHEMAS: "false"
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    volumes:
      - ../db/personal/migration:/flyway/sql:ro
    depends_on:
      personal-init:
        condition: service_completed_successfully

  # 개발 전용 GUI이며 localhost에만 열린다. Kafka UI: http://localhost:8080  Adminer: http://localhost:8081
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: stock-kafka-ui
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "false"
    depends_on:
      kafka:
        condition: service_healthy

  # 브라우저에서 로그인: System=PostgreSQL, Server=postgres, 사용자·비밀번호는 .env 값, DB=${POSTGRES_DB}
  adminer:
    image: adminer:4.8.1
    container_name: stock-adminer
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  kafka-data:
  pg-data:
