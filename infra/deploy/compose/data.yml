# 데이터 서버(Lightsail 2GB)의 Kafka와 Postgres. 서비스 서버의 사설 주소에서만 접속한다.
# 서버에서: docker compose -f data.yml --env-file /etc/stock-reading/data.env up -d
# 값은 data.env.example(infra/deploy/server/)을 보고 채운다. 이 파일은 서비스 서버의 배포 타이머가 건드리지 않는다.
name: stock-data

services:
  kafka:
    image: apache/kafka:4.2.2
    container_name: stock-kafka
    restart: unless-stopped
    ports:
      # 사설 주소에만 연다. 기본값(127.0.0.1)이면 서비스 서버가 닿지 못하므로 서버에서는 DATA_PRIVATE_IP 를 반드시 채운다.
      - "${DATA_PRIVATE_IP:-127.0.0.1}:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT 는 서비스 서버가 쓰는 주소(사설 주소로 알림), INTERNAL 은 컨테이너 안의 상태 확인과 브로커 사이 통신용이며 밖에 열지 않는다.
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${DATA_PRIVATE_IP:-127.0.0.1}:9092,INTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # 토픽은 서비스가 시작할 때 선언한다. 자동 생성을 켜면 소비자가 먼저 떠서 파티션 1개짜리 토픽을 만든다.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # 2GB 서버에서 Postgres 와 나눠 쓰므로 힙을 작게 고정한다.
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xms384m -Xmx384m}
    mem_limit: ${KAFKA_MEM_LIMIT:-768m}
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  postgres:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    container_name: stock-postgres
    restart: unless-stopped
    ports:
      - "${DATA_PRIVATE_IP:-127.0.0.1}:5432:5432"
    # 서비스 5개가 연결 풀을 나눠 쓰므로 기본 연결 수로 충분하다. 메모리는 서버 2GB 에 맞춰 줄인다.
    command: ["postgres", "-c", "shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}", "-c", "max_connections=100"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stock}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD must be set in data.env}
      MARKET_DB_USER: ${MARKET_DB_USER:-market_svc}
      MARKET_DB_PASSWORD: ${MARKET_DB_PASSWORD:?MARKET_DB_PASSWORD must be set in data.env}
      NEWS_DB_USER: ${NEWS_DB_USER:-news_svc}
      NEWS_DB_PASSWORD: ${NEWS_DB_PASSWORD:?NEWS_DB_PASSWORD must be set in data.env}
      BRIEFING_DB_USER: ${BRIEFING_DB_USER:-briefing_svc}
      BRIEFING_DB_PASSWORD: ${BRIEFING_DB_PASSWORD:?BRIEFING_DB_PASSWORD must be set in data.env}
    mem_limit: ${POSTGRES_MEM_LIMIT:-768m}
    volumes:
      - pg-data:/var/lib/postgresql/data
      # 계정과 스키마를 만드는 초기화 SQL(볼륨을 처음 만들 때 한 번 실행). 로컬 개발과 같은 파일이다.
      - ../../compose/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-postgres} -d ${POSTGRES_DB:-stock}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  kafka-data:
  pg-data:
