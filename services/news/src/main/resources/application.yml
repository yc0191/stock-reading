spring:
  application:
    name: news
  config:
    # 로컬 개발용 비밀값은 저장소 루트의 git 제외 .env에서 가져온다.
    import: optional:file:./.env[.properties],optional:file:../../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:stock}?currentSchema=news
    username: ${NEWS_DB_USER:news_svc}
    password: ${NEWS_DB_PASSWORD}
  flyway:
    schemas: news
    default-schema: news
    create-schemas: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: news
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      # 기사 응답이 길어질 수 있어 전송 구간에서 압축한다. 소비자는 알아서 푼다.
      compression-type: gzip
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        # 보내는 모든 메시지 헤더에 본문 correlationId 를 싣는다(추적 ID, docs/local-development.md).
        interceptor.classes: dev.stockreading.news.trace.CorrelationIdProducerInterceptor

# 브리핑이 부르는 내부 조회 API(docs/local-development.md 의 "내부 조회 API"). 서버 밖으로 열지 않는다.
server:
  # 로컬에서는 시세처리기(8091)·뉴스처리기(8092)가 한 기계에 함께 뜨고, 로컬 compose 가 쓰는 8080·8081 과 겹치지 않게 둔다.
  port: 8092
  # 로컬은 이 기계 안에서만 받는다. 운영 compose 는 SERVER_ADDRESS=0.0.0.0 으로 컨테이너 네트워크에만 열고 바깥 포트는 연결하지 않는다.
  address: 127.0.0.1
  tomcat:
    threads:
      # 부르는 쪽이 브리핑 하나라 요청이 많지 않다. 기본 200개 스레드의 스택 메모리를 아끼려고 줄인다.
      max: 8
      min-spare: 1

logging:
  pattern:
    # 메시지를 처리하는 동안 찍히는 로그 줄마다 그 메시지의 correlationId 를 붙인다(추적 ID, docs/local-development.md).
    correlation: "[%X{correlationId:-}] "
