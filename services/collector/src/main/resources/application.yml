spring:
  application:
    name: collector
  main:
    web-application-type: none
  # 타이머 스레드 수: 타이머(수집 작업 6개, 데일리 판 시작 알림 2개)마다 한 자리. 기본 1개면 오래 걸리는
  # 작업(뉴스·장 시작 전·장중·마감 후)이 도는 동안 1초 현재가 타이머가 멈춘다.
  task:
    scheduling:
      pool:
        size: 8
  # 수집 대상과 뉴스 검색어(시작할 때 한 번), 구성 종목 조회 대상(조회할 때마다)을 읽기 전용 계정으로 읽는다. 쓰기는 하지 않는다.
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:stock}
    username: ${COLLECTOR_DB_USER:collector_svc}
    password: ${COLLECTOR_DB_PASSWORD:}
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: collector
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        # 보내는 모든 메시지 헤더에 본문 correlationId 를 싣는다(추적 ID, docs/local-development.md).
        interceptor.classes: dev.stockreading.collector.trace.CorrelationIdProducerInterceptor

collector:
  # 1초 현재가 조회 주기. 1초 미만이면 회차의 기준 시각(scheduledFor, 초 단위)과 correlationId 가 겹친다.
  # 앞 회차 조회가 끝나지 않았으면 이번 회차는 조회하지 않고, 그 회차 차례인 종목만 건너뜀(SupersededByNewerTick)으로 기록한다.
  # 이때 차례는 넘기지 않아 다음 회차가 같은 종목을 부른다.
  tick-interval-ms: ${COLLECTOR_TICK_INTERVAL_MS:1000}
  # 한 회차에서 부르는 종목 수. 종목이 더 많으면 회차마다 목록을 돌며 번갈아 부르고 차례 아닌 종목은 기록하지 않는다.
  # 1 이상이고 broker.max-calls-per-second 이하여야 하며, 어기면 시작하지 못한다.
  # 종목당 조회 간격은 올림(종목 수 / 이 값) x 주기다.
  # 기본 8인 이유: 상한(기본 10)과 같게 두면 회차 사이 타이밍 어긋남과 장중 5분마다 도는 다른 조회(환율·시장종합·세계지수)가
  # 같은 상한을 써서 일부 호출을 놓친다. 상한이 이 값의 1.2배 이상이 되게 여유를 둔다(가짜 서버 부하 실측).
  quote-per-tick: ${COLLECTOR_QUOTE_PER_TICK:8}
  schedule:
    # 꺼 두면 수집기 타이머가 1초 현재가와 뉴스를 수집하지 않는다.
    enabled: ${COLLECTOR_SCHEDULE_ENABLED:false}
    # 뉴스 수집 주기(15분)
    news-interval-ms: 900000
  quote-hours:
    # 1초 현재가를 조회하는 시간대(한국 시간 HH:mm, 양끝 포함, 평일만). 뉴스 수집은 이 시간대와 상관없다.
    # 장 밖에서는 현재가가 전일 종가 그대로라 조회하지 않는다. 휴장일도 조회하지 않는다.
    start: "${COLLECTOR_QUOTE_START:09:00}"
    end: "${COLLECTOR_QUOTE_END:15:30}"
  pre-open:
    # 꺼 두면 수집기 타이머가 장 시작 전 수집을 하지 않는다. 휴장일에는 수집하지 않는다(시세 제공자의 장 운영 상태로 판정, 판정하지 못하면 영업일로 본다).
    # 한 회차에서 보유 미국 종목 해외 일봉, 세계지수 아메리카(C), SEC 공시를 받는다. 공시는 이때만 받는다.
    enabled: ${COLLECTOR_PRE_OPEN_ENABLED:false}
    # 한국 시간 기준 cron(초 분 시 일 월 요일)
    cron: ${COLLECTOR_PRE_OPEN_CRON:0 30 8 * * MON-FRI}
  members:
    # 꺼 두면 ETF 구성 종목 조회를 하지 않는다. 휴장일에는 조회하지 않는다(시세 제공자의 장 운영 상태로 판정, 판정하지 못하면 영업일로 본다).
    # 회차마다 시세처리기 표(market.etf·etf_stock_history·index_rebalance_schedule)를 읽기 전용으로 읽어 그날 받을 차례인 ETF만 받고,
    # 응답마다 etf.members.fetched 를 발행한다. 원문 저장과 비교·반영은 시세처리기가 한다.
    enabled: ${COLLECTOR_MEMBERS_ENABLED:false}
    # 한국 시간 기준 cron(초 분 시 일 월 요일)
    cron: ${COLLECTOR_MEMBERS_CRON:0 0 8 * * MON-FRI}
    # 출처 주소는 저장소에 두지 않고 환경변수로만 받는다. 비어 있으면 조회하지 않고, 구성 종목은 etf_stock_map을 직접 고친다.
    # {fundId}(출처가 ETF를 부르는 번호, etf.constituent_source_id)와 {date}(yyyy.MM.dd, 기준일) 자리가 있다.
    # 번호가 없는 ETF는 자동 조회하지 않는다.
    url-template: ${MEMBERS_URL_TEMPLATE:}
    # 요청마다 보내는 식별 문자열. 연락처가 필요하면 환경변수로 바꾼다(ASCII만).
    user-agent: ${MEMBERS_USER_AGENT:stock-reading-members/1.0}
    # 구성 종목에 담을 상위 개수(주식만).
    top-count: 10
    # 평소에 구성을 받는 요일. 지수 교체일이 든 달에는 매일 받는다(index_rebalance_schedule 테이블).
    fetch-day: MONDAY
    # 출처를 연달아 부르는 사이의 쉬는 시간과 요청 제한 시간.
    call-interval: PT2S
    timeout: PT10S
  intraday:
    # 꺼 두면 수집기 타이머가 장중 수집을 하지 않는다. 휴장일에는 수집하지 않는다(시세 제공자의 장 운영 상태로 판정, 판정하지 못하면 영업일로 본다).
    # 한 회차에서 환율종합, 시장종합, 세계지수 아시아(S)·아메리카(C)를 시차를 두고 차례로 받는다.
    enabled: ${COLLECTOR_INTRADAY_ENABLED:false}
    # 한국 시간 기준 cron(초 분 시 일 월 요일). 주기를 정하고, 끝 시각은 아래 end 로 거른다.
    cron: "${COLLECTOR_INTRADAY_CRON:0 */5 9-15 * * MON-FRI}"
    # 한국 시간 HH:mm. 이 범위 밖의 회차는 수집하지 않는다(양끝 포함).
    start: "${COLLECTOR_INTRADAY_START:09:00}"
    end: "${COLLECTOR_INTRADAY_END:15:30}"
    # 장중 조회 사이 대기(밀리초). 같은 1초에 시세 조회 자리를 여럿 빼앗지 않게 나눠 보낸다. 0~60000.
    stagger-ms: ${COLLECTOR_INTRADAY_STAGGER_MS:15000}
  insight:
    schedule:
      # 꺼 두면 수집기 타이머가 마감 후 수집을 하지 않는다. 휴장일에는 수집하지 않는다(시세 제공자의 장 운영 상태로 판정, 판정하지 못하면 영업일로 본다).
      enabled: ${COLLECTOR_INSIGHT_SCHEDULE_ENABLED:false}
      # 한국 시간 기준 cron(초 분 시 일 월 요일)
      cron: ${COLLECTOR_INSIGHT_CRON:0 30 16 * * MON-FRI}
    # 일봉 조회의 시장구분과 조회 건수
    daily-market-class: "0"
    daily-count: 30
    # 세계지수 대륙구분: S(아시아), C(아메리카), E(유럽). 대륙마다 한 번씩 조회한다.
    continents: C,S,E
    # 보유 미국 종목의 해외 일봉 조회 건수
    overseas-daily-count: 30
    # 한 번에 해외 일봉을 조회할 종목 수 상한. 넘친 종목은 호출하지 않고 건너뛴 개수만 경고로 남긴다.
    overseas-max-tickers: 100
  daily-briefing:
    # 꺼 두면 데일리 판 시작 알림(daily.collection.completed)을 발행하지 않는다. 브리핑의 한도 시각 안전장치도 같은 환경변수로 켠다.
    # 아침 판: 장 시작 전 수집 결과(못 받은 자료 목록)를 담아 개장 흐름 구간이 끝나는 이 시각에 낸다.
    # 마감 후 판: 마감 후 수집(타이머 또는 수동 실행 명령)이 끝나는 즉시 낸다. 아래 post-close-cron 은 휴장 알림 시각이다.
    # 휴장일(시세 제공자의 장 운영 상태로 판정, 판정하지 못하면 영업일로 본다)에는 두 판 시각에 '휴장이라 수집 안 함'을 낸다.
    enabled: ${COLLECTOR_DAILY_BRIEFING_ENABLED:false}
    # 한국 시간 기준 cron(초 분 시 일 월 요일). 한 판만 끄려면 그 판의 값을 "-" 로 준다.
    # 아침 판 시각은 브리핑의 morning_merge_end(09:10)와 같아야 하고, 브리핑의 한도 시각(아침 09:20)보다 앞서야 한다.
    morning-cron: ${COLLECTOR_DAILY_BRIEFING_MORNING_CRON:0 10 9 * * MON-FRI}
    # 휴장일의 마감 후 판 알림 시각. 마감 후 수집 시각(collector.insight.schedule.cron)과 같게 두며, 브리핑의 한도 시각(17:30)보다 앞서야 한다.
    post-close-cron: ${COLLECTOR_DAILY_BRIEFING_POST_CLOSE_CRON:0 30 16 * * MON-FRI}
  market-data:
    # simulator | broker
    source: ${COLLECTOR_MARKET_DATA_SOURCE:simulator}
  market-status:
    # 시세 제공자의 장 운영 상태 조회로 휴장일을 판정한다. 경로와 응답 칸 이름은 제공자 문서에서 확인해 환경변수로 넣는다.
    # 하나라도 비어 있으면 시작할 때 경고를 한 번 남기고 휴장일을 판정하지 않는다(늘 영업일로 본다).
    # 평일 이 시각(한국 시간 cron)에 그날의 장 운영 상태를 미리 판정해 하루 동안 쓴다. 가장 이른 타이머(구성 종목 조회)보다 앞서거나 같아야 한다.
    decide-cron: "0 0 8 * * MON-FRI"
    path: ${BROKER_MARKET_STATUS_PATH:}
    # 응답에서 현재 일자를 담은 칸과 기준 영업일을 담은 칸. 두 값이 같으면 영업일이다.
    today-field: ${BROKER_MARKET_STATUS_TODAY_FIELD:}
    business-day-field: ${BROKER_MARKET_STATUS_BUSINESS_DAY_FIELD:}
    # 한 번 판정에 쓰는 전체 시간 상한. 넘으면 남은 시도를 하지 않고 영업일로 본다(스케줄러 스레드를 오래 잡지 않으려는 것).
    lookup-timeout: ${BROKER_MARKET_STATUS_TIMEOUT:5s}
  broker:
    # 주소와 키는 환경변수로만 받는다(키는 Parameter Store -> .env).
    base-url: ${BROKER_BASE_URL:}
    app-key: ${BROKER_APP_KEY:}
    app-secret: ${BROKER_APP_SECRET:}
    timeout-seconds: 10
    # 응답 대기 제한은 현재가 조회에만 이 값을 쓰고, 토큰 발급과 그 밖의 조회는 위 timeout-seconds 를 쓴다. 연결 맺기 제한은 HTTP 클라이언트를 같이 쓰므로 모든 요청에 이 값이 걸린다.
    quote-timeout-seconds: ${BROKER_QUOTE_TIMEOUT_SECONDS:2}
    # 초당 시세 호출 상한. 한 회차에 부르는 수(collector.quote-per-tick)가 이보다 크면 시작하지 못하고,
    # 차례였는데 다른 조회와 겹쳐 상한에 걸린 종목은 건너뜀으로 기록한다.
    # 회차당 수와 같게 두면 오래 돌 때 일부 호출을 놓치므로 회차당 수의 1.2배 이상으로 둔다(고정 부하 실측).
    # 실제 서버가 5분 버틴 가장 높은 속도는 초당 12회였으므로 그 아래로 둔다(실측).
    max-calls-per-second: ${BROKER_MAX_CALLS_PER_SECOND:10}
    # 현재가를 같은 응답의 전일대비·등락률·고저가와 맞춰 보고, 판단할 수 있는 검사 중 과반이 어긋나면
    # 시세로 보내지 않고 FIELD_MISMATCH 실패로 남긴다(응답 원문 포함).
    price-check:
      enabled: ${BROKER_PRICE_CHECK_ENABLED:true}
      # 가격 비율. 중간가 체결은 5원 단위 사이 값으로 오고 전일대비·등락률은 5원 단위로 계산돼 와서 0 이면 멀쩡한 값도 버린다.
      tolerance: ${BROKER_PRICE_CHECK_TOLERANCE:0.003}
      # 아래 칸 이름과 부호 구분 값의 기본값은 2026-11-04 장중 실제 응답에서 확인한 값이다. 현재가 칸 이름처럼
      # 공개 API 식별자로 보고 기본값으로 두며, 제공자 응답이 바뀌면 환경변수로 덮어쓴다.
      # 비어 있는 검사는 판단하지 않으며, 모두 비우면 검사 없이 통과한다(시작할 때 경고).
      # 전일 종가로 쓸 수 있는 칸들(쉼표 구분). 하나라도 맞으면 전일대비·등락률 검사를 통과한다.
      base-fields: ${BROKER_PRICE_CHECK_BASE_FIELDS:bdy_cls_prc,sprc,krx_bdy_clpr}
      change-field: ${BROKER_PRICE_CHECK_CHANGE_FIELD:bdy_cmpr}
      change-sign-field: ${BROKER_PRICE_CHECK_CHANGE_SIGN_FIELD:bdy_cmpr_ccd}
      # 부호 구분 칸의 상승·보합·하락 값(쉼표 구분). 어느 쪽에도 없는 값이면 전일대비 검사를 판단하지 않는다.
      # 2026-11-04 실데이터에는 2·3·5 만 나왔다. 상승의 1, 하락의 4 는 관례(상한·하한)로 넣은 미확인 값이다.
      sign-up: ${BROKER_PRICE_CHECK_SIGN_UP:1,2}
      sign-flat: ${BROKER_PRICE_CHECK_SIGN_FLAT:3}
      sign-down: ${BROKER_PRICE_CHECK_SIGN_DOWN:4,5}
      rate-field: ${BROKER_PRICE_CHECK_RATE_FIELD:up_dwn_r_p2}
      high-field: ${BROKER_PRICE_CHECK_HIGH_FIELD:hgh_prc}
      low-field: ${BROKER_PRICE_CHECK_LOW_FIELD:lw_prc}
  news-search:
    base-url: ${NEWS_SEARCH_BASE_URL:}
    client-id: ${NEWS_SEARCH_CLIENT_ID:}
    client-secret: ${NEWS_SEARCH_CLIENT_SECRET:}
    # 인증 헤더 이름은 제공자가 정한 값이라 환경변수로 받는다.
    id-header: ${NEWS_SEARCH_ID_HEADER:}
    secret-header: ${NEWS_SEARCH_SECRET_HEADER:}
    display: 20
    timeout-seconds: 10
    # 하루(한국 시간) 검색 API 호출 상한. 제공자 한도보다 조금 낮게 둔다. 0 이하이면 시작 단계에서 실패한다.
    daily-call-limit: ${NEWS_SEARCH_DAILY_CALL_LIMIT:19500}
    # 검색어를 연달아 호출할 때 호출 사이의 대기(밀리초). 0이면 기다리지 않는다.
    call-interval-ms: ${NEWS_SEARCH_CALL_INTERVAL_MS:60}
  news-research:
    # 브리핑의 뉴스 재검색 요청 하나에서 실제로 검색할 검색어 수 상한. 넘는 검색어는 버린다.
    # 검색어마다 위 하루 호출 상한을 한 번씩 쓴다. 0 이하이면 시작 단계에서 실패한다.
    max-queries: ${NEWS_RESEARCH_MAX_QUERIES:3}
  edgar:
    base-url: https://data.sec.gov
    ticker-map-url: https://www.sec.gov/files/company_tickers_exchange.json
    archives-base-url: https://www.sec.gov/Archives/edgar/data
    # SEC 가 요구하는 "회사명 연락이메일". 연락 이메일은 개인 정보라서 값은 환경변수로만 준다. 비어 있으면 호출하지 않는다.
    user-agent: ${EDGAR_USER_AGENT:}
    timeout-seconds: 10
    # SEC 공정 접근 한도는 초당 10회다. 1~10 만 허용한다.
    max-calls-per-second: 10
    # 수집할 공시 형식(쉼표 구분). 비거나 형식이 틀리면 시작 단계에서 실패한다.
    # 6-K 는 미국에 상장한 외국 기업이 8-K 대신 내는 공시라 넣는다. 10-Q/10-K 는 실적이 8-K 항목 2.02 로 먼저 나와 뺀다.
    forms: ${EDGAR_FORMS:8-K,8-K/A,6-K}
    # 접수 시각이 이 시간 안인 공시만 발행한다. 공시는 평일 장 시작 전에 하루 한 번만 받으므로
    # 금요일→월요일 간격(72시간)보다 넉넉하게, 수집기가 며칠 꺼지거나 연휴가 끼어도 빠지지 않게 7일로 둔다.
    lookback-hours: 168
  dart:
    base-url: https://opendart.fss.or.kr/api
    # 비밀: 환경변수로만 받는다(Parameter Store -> .env).
    api-key: ${DART_API_KEY:}
    page-count: 100
    timeout-seconds: 10

logging:
  pattern:
    # 메시지를 처리하는 동안 찍히는 로그 줄마다 그 메시지의 correlationId 를 붙인다(추적 ID, docs/local-development.md).
    correlation: "[%X{correlationId:-}] "
