spring:
  application:
    name: market
  main:
    web-application-type: none
  config:
    # 로컬 개발용 비밀값은 저장소 루트의 git 제외 .env에서 가져온다.
    import: optional:file:./.env[.properties],optional:file:../../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:stock}?currentSchema=market
    username: ${MARKET_DB_USER:market_svc}
    password: ${MARKET_DB_PASSWORD}
  flyway:
    schemas: market
    default-schema: market
    create-schemas: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: market
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      # 시세 이력·기사 응답이 길어질 수 있어 전송 구간에서 압축한다. 소비자는 알아서 푼다.
      compression-type: gzip
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

market:
  # 유형 1(window): 최근 window-minutes분 이력의 가장 오래된 스냅샷 대비 변동의 절댓값이 이 값(%) 이상이면 "변동"으로 본다.
  window-minutes: 5
  window-threshold-percent: 1.00
  # 유형 2(prevClose): 응답 원문(raw)의 전일 종가 필드 대비 변동의 절댓값이 이 값(%) 이상이면 "변동"으로 본다.
  # prev-close-fields는 시세 응답의 전일 종가 후보 항목 세 개다. 제공자가 이 항목들을 하루 안에서도 깨뜨려 보내서(2026-11-04 확인)
  # 한 항목만 믿지 않고, 두 항목 이상이 같은 값일 때만 그 값을 전일 종가로 쓴다. 다수가 없으면 그 스냅샷은 유형 2를 판단하지 않는다.
  # MARKET_PREV_CLOSE_FIELDS를 쉼표로 이은 경로(원문 루트 기준 점 경로)로 주면 바꾸고, 빈 값으로 주면 유형 2를 끈다.
  prev-close-fields: ${MARKET_PREV_CLOSE_FIELDS:dataBody.bdy_cls_prc,dataBody.sprc,dataBody.krx_bdy_clpr}
  prev-close-threshold-percent: 3.00
  # 두 유형 모두 변동 조건이 받은 스냅샷 기준으로 이 건수만큼 연속 이어질 때만 발행한다(빠진 초는 세지 않는다).
  # 현재가 한 건이 튀었다 돌아오는 가짜 변동을 거른다. 연속 확인을 받지 못한 튄 점은 유형 1의 기준값으로도 쓰지 않는다.
  confirm-count: 3
  # 장 시작 직후 첫 체결 전 응답(현재가가 전일 종가 그대로)을 알아보는 원문 칸. 모든 칸 값이 0이면 유형 1의 기준값에서 뺀다.
  # MARKET_FIRST_TRADE_FIELDS를 쉼표로 이은 경로로 주면 바꾸고, 빈 값으로 주면 거르지 않는다.
  first-trade-fields: ${MARKET_FIRST_TRADE_FIELDS:dataBody.acml_vlm,dataBody.opn_prc}
  # 한 종목의 market.move를 발행한 뒤 이 시간(분) 동안은 유형과 상관없이 같은 종목을 다시 발행하지 않는다. 0이면 끈다.
  # 단 마지막 발행 가격 대비 republish-exception-percent(%) 이상 더 움직이면 간격 안이라도 발행한다.
  republish-interval-minutes: 30
  republish-exception-percent: 2.00
  holdings:
    # 보유 ETF와 구성 종목이 담긴 UTF-8 JSON 파일의 경로. 파일은 저장소 밖에 두고 경로만 환경변수로 준다.
    # 종목 테이블(instrument)이 비어 있을 때 시작하면서 한 번만 이 파일로 채운다. 행이 있으면 파일은 읽지 않고,
    # 그 뒤의 고침은 테이블을 직접 고친다. 비어 있으면(파일도 없으면) 보유 종목이 없는 것으로 본다.
    file: ${HOLDINGS_FILE:}
    # 종목 테이블이 바뀌었는지 확인하는 간격. 바뀌었을 때만 market.holdings 이벤트로 전체 목록을 낸다.
    check-interval: PT30S
  context:
    # 배경 자료 응답(market.context)의 안전 상한. 요청값의 원본은 브리핑 설정이고, 요청이 이보다 크면 이 값까지만 준다.
    # 받은 시각이 기준 시각보다 이 기간 넘게 이른 자료는 없음으로 본다(해외 등락률은 장 마감 시각 기준).
    max-age: P4D
    # 배경 자료 원문 1건의 최대 크기(UTF-8 바이트). 넘으면 원문을 빼고 너무 큼으로 표시한다.
    max-response-bytes: 32768
    # 응답에 담을 미국 종목 티커의 최대 개수.
    max-tickers: 100
    # 배경 자료로 줄 세계지수 대륙구분. 수집기의 마감 후 수집 대륙과 맞춘다.
    world-index-continents: C,S,E
    # 세계지수 직전 영업일 행을 찾는 기간. 기준 시각보다 이 기간까지 이르게 받은 행에서 찾으며 판 범위와는 따로 둔다.
    # 연휴가 길어도 직전 영업일 행이 남도록 max-age보다 길게 둔다.
    world-index-prev-lookback: P7D
  members:
    # ETF 상위 구성 종목 자동 조회. 출처 주소와 ETF별 번호는 저장소에 두지 않고 환경변수로만 받는다.
    # url-template이 비어 있으면 자동 조회를 하지 않고, 구성 종목은 종목 테이블을 직접 고친다.
    # url-template에는 {fundId}(출처가 ETF를 부르는 번호)와 {date}(yyyy.MM.dd, 기준일) 자리가 있다.
    url-template: ${MEMBERS_URL_TEMPLATE:}
    # "ETF코드:번호"를 쉼표로 이은 값. 여기에 없는 ETF는 자동 조회하지 않는다.
    fund-ids: ${MEMBERS_FUND_IDS:}
    # 요청마다 보내는 식별 문자열. 연락처가 필요하면 환경변수로 바꾼다(ASCII만).
    user-agent: ${MEMBERS_USER_AGENT:stock-reading-members/1.0}
    # 구성 종목에 담을 상위 개수(주식만).
    top-count: 10
    # 평소에 구성을 받는 요일. 지수 교체일이 든 달에는 매일 받는다(index_rebalance_schedule 테이블).
    fetch-day: MONDAY
    # 출처를 연달아 부르는 사이의 쉬는 시간과 요청 제한 시간.
    call-interval: PT2S
    timeout: PT10S
  daily:
    # 데일리 판 자료 응답(market.daily)에 담을 보유 ETF의 최대 개수(안전 상한). 기간·원문 크기·티커 수·세계지수 대륙은 context 설정을 함께 쓴다.
    max-etfs: 50
