spring:
  application:
    name: market
  main:
    web-application-type: none
  config:
    # 로컬 개발용 비밀값은 저장소 루트의 git 제외 .env에서 가져온다.
    import: optional:file:./.env[.properties],optional:file:../../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:stock}?currentSchema=market
    username: ${MARKET_DB_USER:market_svc}
    password: ${MARKET_DB_PASSWORD}
  flyway:
    schemas: market
    default-schema: market
    create-schemas: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: market
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      # 시세 이력·기사 응답이 길어질 수 있어 전송 구간에서 압축한다. 소비자는 알아서 푼다.
      compression-type: gzip
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

market:
  # 유형 1(window): 최근 window-minutes분 이력의 가장 오래된 스냅샷 대비 변동의 절댓값이 이 값(%) 이상이면 "변동"으로 본다.
  window-minutes: 5
  window-threshold-percent: 1.00
  # 유형 2(prevClose): 응답 원문(raw)의 전일 종가 필드 대비 변동의 절댓값이 이 값(%) 이상이면 "변동"으로 본다.
  # prev-close-field는 시세 응답의 전일 종가 항목이다. 실제 응답 샘플 2개에서 현재가와 이 항목으로 계산한 등락률이 응답의 등락률과 같음을 확인했다.
  # 제공자 고유 항목 이름은 공개 파일에 쓰지 않으므로 공유 .env의 MARKET_PREV_CLOSE_FIELD로만 넣는다. 비어 있으면 유형 2를 끈다.
  prev-close-field: ${MARKET_PREV_CLOSE_FIELD:}
  prev-close-threshold-percent: 3.00
