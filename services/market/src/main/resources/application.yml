spring:
  application:
    name: market
  main:
    web-application-type: none
  config:
    # 로컬 개발용 비밀값은 저장소 루트의 git 제외 .env에서 가져온다.
    import: optional:file:./.env[.properties],optional:file:../../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:stock}?currentSchema=market
    username: ${MARKET_DB_USER:market_svc}
    password: ${MARKET_DB_PASSWORD}
  flyway:
    schemas: market
    default-schema: market
    create-schemas: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: market
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

market:
  # 유형 1(window): 최근 window-minutes분 이력의 가장 오래된 스냅샷 대비 변동의 절댓값이 이 값(%) 이상이면 "변동"으로 본다.
  window-minutes: 5
  window-threshold-percent: 1.00
  # 유형 2(prevClose): 응답 원문(raw)의 전일 종가 필드 대비 변동의 절댓값이 이 값(%) 이상이면 "변동"으로 본다.
  # prev-close-field는 임시 자리표시 이름이다. 실제 응답 원문을 보고 확정해야 하며, 그 전에는 유형 2가 감지하지 않는다.
  prev-close-field: PREV_CLOSE_PLACEHOLDER
  prev-close-threshold-percent: 3.00
