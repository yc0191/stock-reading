<text x="470" y="482" text-anchor="start" font-size="13" font-weight="400" fill="#1f2328">· 급변동 한 건 / 하루 두 번 판마다 작업</text>
<text x="470" y="503" text-anchor="start" font-size="13" font-weight="400" fill="#1f2328">· LLM 문장의 근거 번호를 코드가 검사</text>
<text x="470" y="524" text-anchor="start" font-size="13" font-weight="400" fill="#1f2328">· 근거 약한 문장만 다시 검색해 고쳐 씀</text>
<text x="470" y="545" text-anchor="start" font-size="13" font-weight="400" fill="#1f2328">· 보내기 전 전체 검사, 단계별 실행 기록</text>
