<text x="40" y="482" text-anchor="start" font-size="13" font-weight="400" fill="#1f2328">· 시세·지수·환율·구성 종목 저장</text>
<text x="40" y="503" text-anchor="start" font-size="13" font-weight="400" fill="#1f2328">· 급변동 감지: 연속 확인, 재발행 간격</text>
<text x="40" y="524" text-anchor="start" font-size="13" font-weight="400" fill="#1f2328">· 조회 API: 시세 이력·배경 자료</text>
<rect x="454" y="428" width="402" height="128" rx="12" fill="#eef4ff" stroke="#3b6fd4" stroke-width="1.6"/>
