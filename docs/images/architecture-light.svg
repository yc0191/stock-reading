<text x="1025" y="456" text-anchor="start" font-size="12" font-weight="400" fill="#59636e">Java</text>
<text x="932" y="482" text-anchor="start" font-size="13" font-weight="400" fill="#1f2328">· 기사·공시 저장(중복 제거)</text>
<text x="932" y="503" text-anchor="start" font-size="13" font-weight="400" fill="#1f2328">· 조회 API: 시각 범위 안 기사·공시</text>
<text x="932" y="524" text-anchor="start" font-size="13" font-weight="400" fill="#1f2328">· ETF로 꺼내면 구성 종목 기사까지</text>
