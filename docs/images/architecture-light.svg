<rect x="172" y="44" width="430" height="128" rx="12" fill="#eef4ff" stroke="#3b6fd4" stroke-width="1.6"/>
<text x="188" y="72" text-anchor="start" font-size="17" font-weight="700" fill="#1f2328">수집기</text>
<text x="247" y="72" text-anchor="start" font-size="12" font-weight="400" fill="#59636e">Java</text>
<text x="188" y="98" text-anchor="start" font-size="13" font-weight="400" fill="#1f2328">· 타이머: 1초 시세, 주기마다 뉴스·공시·지수·환율</text>
<text x="188" y="119" text-anchor="start" font-size="13" font-weight="400" fill="#1f2328">· 평일 아침 ETF 구성 종목 조회</text>
<text x="188" y="140" text-anchor="start" font-size="13" font-weight="400" fill="#1f2328">· 마감 후 실패분 재시도 → 판 시작 알림</text>
<rect x="640" y="44" width="320" height="128" rx="12" fill="#eef4ff" stroke="#3b6fd4" stroke-width="1.6"/>
