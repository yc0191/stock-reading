<text x="715" y="72" text-anchor="start" font-size="12" font-weight="400" fill="#59636e">Java</text>
<text x="656" y="98" text-anchor="start" font-size="13" font-weight="400" fill="#1f2328">· 멤버 수신 설정으로 받는 사람 고름</text>
<text x="656" y="119" text-anchor="start" font-size="13" font-weight="400" fill="#1f2328">· 글자판 + HTML·그림 메일</text>
